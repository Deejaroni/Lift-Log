<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lift Log</title>
<meta name="theme-color" content="#E6EAEE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151A21" media="(prefers-color-scheme: dark)">
<meta name="description" content="A simple workout journal: log exercises, weight, reps, sets and drop sets, and chart your progress.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="vendor/chart.umd.min.js"></script>
<style>
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:500;font-display:swap;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
:root{
  --bg:#E6EAEE; --surface:#FFFFFF; --ink:#1B2430; --muted:#5B6776; --line:#CBD2DA;
  --red:#C8232C; --blue:#1F5FA8; --yellow:#D99A00; --green:#2E8B57;
  --field:#F3F5F7;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151A21; --surface:#1F2630; --ink:#E9EDF2; --muted:#9AA6B4; --line:#323C48;
    --red:#E5484D; --blue:#4C8FE0; --yellow:#F0B429; --green:#3FB27A; --field:#28313C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#151A21; --surface:#1F2630; --ink:#E9EDF2; --muted:#9AA6B4; --line:#323C48;
  --red:#E5484D; --blue:#4C8FE0; --yellow:#F0B429; --green:#3FB27A; --field:#28313C;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.num{font-family:"Barlow Condensed","Arial Narrow",Barlow,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 96px}

header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:8px 0 16px}
header h1{font-size:2.4rem;line-height:1;margin:0;font-weight:700;letter-spacing:.01em}
.plates{display:flex;gap:3px;align-items:center;margin-right:10px}
.plates i{display:block;width:7px;border-radius:2px}
.brand{display:flex;align-items:center}
.unit-toggle{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.unit-toggle button{border:0;background:none;padding:4px 12px;font-weight:600;color:var(--muted)}
.unit-toggle button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{flex:1;max-width:240px;border:0;background:none;padding:12px 8px 14px;font-weight:600;color:var(--muted);border-top:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-top-color:var(--red)}

[hidden]{display:none!important}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
label.lbl{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=search],input[type=date],input[type=number],select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:1.05rem}
.row{display:grid;gap:12px}
.row>*{min-width:0}
input[type=search]{-webkit-appearance:none;appearance:none;color:var(--ink)}
input[type=search]::-webkit-search-decoration{-webkit-appearance:none}
input::placeholder{color:var(--muted);opacity:1}
.row.pair{grid-template-columns:1fr 1fr}
input,select{min-width:0;max-width:100%}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-height:52px;line-height:1.3}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
@media (min-width:560px){.row.two{grid-template-columns:2fr 1fr}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--field);border-radius:999px;padding:6px 12px;font-size:.9rem;white-space:nowrap}

.steppers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stepper{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:8px 6px 10px;text-align:center}
.stepper .lbl{margin:0 0 2px;font-size:.8rem}
.stepper input{background:none;border:0;padding:0;text-align:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:2.3rem;line-height:1.1;width:100%;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper .btns{display:flex;justify-content:center;gap:8px;margin-top:4px}
.stepper .btns button{width:40px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:1.3rem;font-weight:600;line-height:1}
.stepper.w{border-color:var(--red)}
.stepper.w .num-unit{font-size:.8rem;color:var(--muted)}

.actions{display:flex;gap:10px;margin-top:16px}
.primary{flex:1;border:0;border-radius:12px;padding:14px;background:var(--red);color:#fff;font-weight:700;font-size:1.1rem;font-family:"Barlow Condensed",sans-serif;letter-spacing:.03em}
.secondary{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface);font-weight:600}
.note-toggle{border:0;background:none;color:var(--blue);padding:10px 0 0;font-weight:600}
.msg{min-height:1.4em;margin-top:10px;font-size:.92rem;color:var(--green);font-weight:600}
.msg.err{color:var(--red)}

h2{font-size:1.5rem;margin:4px 0 10px;font-weight:600}
h3{font-size:1.2rem;margin:0;font-weight:600}
.ex-group{padding:12px 0;border-top:1px solid var(--line)}
.ex-group:first-of-type{border-top:0;padding-top:0}
.ex-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.ex-head .vol{color:var(--muted);font-size:.9rem}
.set{display:flex;align-items:center;gap:10px;padding:5px 0}
.set .num{font-size:1.35rem;font-weight:600;min-width:0}
.set .x{color:var(--muted)}
.set .note{color:var(--muted);font-size:.88rem;flex:1;min-width:0;overflow-wrap:anywhere}
.del{margin-left:auto;-webkit-appearance:none;appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:.85rem;font-weight:600;padding:5px 10px;border-radius:8px;flex:none}
.edit{margin-left:auto;-webkit-appearance:none;appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--blue);font-size:.85rem;font-weight:600;padding:5px 10px;border-radius:8px;flex:none}
.edit + .del{margin-left:6px}
.edit-box{background:var(--field);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;padding:12px;margin:6px 0}
.edit-box h4{margin:0 0 8px;font-family:"Barlow Condensed",sans-serif;font-size:1.1rem;font-weight:600}
.edit-box .eq-grid input,.edit-box .eq-grid select{background:var(--surface);padding:10px;font-size:1rem}
.edit-steps{display:grid;gap:6px;margin-top:10px}
.edit-step{display:grid;grid-template-columns:20px 1fr 1fr 34px;gap:6px;align-items:center}
.edit-step input{background:var(--surface);text-align:center;padding:8px 4px;font-size:1.05rem}
.edit-step .rm{height:40px;border:1px solid var(--line);background:var(--surface);border-radius:8px;color:var(--muted);padding:0}
.edit-actions{display:flex;gap:8px;margin-top:12px}
.edit-actions .primary{padding:10px;font-size:1rem}
.edit-actions .secondary{padding:10px 14px}
.del:hover,.del:active{color:var(--red);border-color:var(--red)}
.day-date{font-family:"Barlow Condensed",sans-serif;font-size:1.3rem;font-weight:600;margin:0 0 8px}
.empty{color:var(--muted);text-align:center;padding:24px 8px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--field);border-radius:10px;padding:10px;text-align:center}
.stat .num{font-size:1.8rem;font-weight:700;line-height:1.1}
.stat small{color:var(--muted);font-size:.8rem}
.chart-box{position:relative;height:240px;margin-top:8px}
.seg{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--field);border-radius:8px;padding:6px 10px;font-size:.9rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mode{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:14px}
.mode button{flex:1;border:0;background:var(--field);padding:10px;font-weight:600;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.drop-rows{margin-top:14px;display:grid;gap:8px}
.drop-row{display:grid;grid-template-columns:20px 1fr 1fr 34px;gap:6px;align-items:center}
.dcell{display:flex;align-items:center;gap:4px;min-width:0}
.dcell button{flex:none;width:30px;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:1.25rem;font-weight:600;line-height:1;padding:0}
.dcell input{flex:1;min-width:0}
.drop-row .idx{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.2rem;color:var(--muted);text-align:center}
.drop-row.peak .idx{color:var(--red)}
.drop-row input{text-align:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.4rem;padding:8px 2px;-moz-appearance:textfield}
.drop-row input::-webkit-outer-spin-button,.drop-row input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.drop-row .rm{height:42px;padding:0;border:1px solid var(--line);background:var(--surface);border-radius:9px;color:var(--muted);font-size:1.1rem}
.drop-head{display:grid;grid-template-columns:20px 1fr 1fr 34px;gap:6px;font-size:.8rem;font-weight:600;color:var(--muted);text-align:center}
.drop-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.drop-tools button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-weight:600}
.drop-tools select{width:auto;padding:8px 10px;font-size:.95rem}
.check{display:flex;gap:8px;align-items:center;margin-top:12px;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--red)}
.chain{padding:6px 0}
.chain-top{display:flex;align-items:center;gap:8px}
.tag{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--field);color:var(--muted);border:1px solid var(--line)}
.chain-steps{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 6px;font-family:"Barlow Condensed",sans-serif;font-size:1.3rem;font-weight:600;margin-top:2px}
.chain-steps .arrow{color:var(--muted);font-size:1rem}
.chain-steps .peak{color:var(--red)}
.chain-steps .fail{font-size:.75rem;font-weight:700;color:var(--red);font-family:Barlow,sans-serif;margin-left:2px}
.equip{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.equip-toggles{display:flex;flex-wrap:wrap;gap:8px}
.tog{position:relative;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--field);border-radius:999px;padding:6px 12px 6px 6px;font-size:.92rem;font-weight:600;cursor:pointer;user-select:none}
.tog input{position:absolute;opacity:0;width:1px;height:1px}
.tog .sw{position:relative;width:34px;height:20px;border-radius:999px;background:var(--line);flex:none;transition:background .15s}
.tog .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.tog input:checked + .sw{background:var(--green)}
.tog input:checked + .sw::after{transform:translateX(14px)}
.tog input:focus-visible + .sw{outline:3px solid var(--blue);outline-offset:2px}
.tog:has(input:checked){border-color:var(--green)}
.eq-fields{margin-top:10px;background:var(--field);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:10px;padding:12px}
.eq-fields h4{margin:0 0 8px;font-family:"Barlow Condensed",sans-serif;font-size:1.1rem;font-weight:600}
.eq-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.eq-grid input[type=text],.eq-grid input[type=number],.eq-grid select{background:var(--surface);padding:10px;font-size:1rem}
.eq-grid .check{margin-top:4px}
.eq-line{display:block;color:var(--muted);font-size:.85rem;font-family:Barlow,sans-serif;font-weight:500}
.day-total{border-top:2px solid var(--ink);margin-top:10px;padding-top:12px}
.day-total .lbl{margin:0 0 6px}
.day-total .stats{margin:0}
.cal{margin-top:12px;background:var(--field);border-radius:10px;padding:12px}
.cal-main{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.cal-main .num{font-size:1.9rem;font-weight:700;line-height:1.1;color:var(--yellow)}
.cal-sub{margin:4px 0 0;color:var(--muted);font-size:.85rem}
.cal-bw{display:flex;gap:8px;align-items:center;margin-top:8px}
.cal-bw input{max-width:170px;background:var(--surface)}
.cal .eq-fields{border-left-color:var(--yellow);background:var(--surface)}
.cal .eq-grid input,.cal .eq-grid select{background:var(--field)}
.steppers.c2{grid-template-columns:repeat(2,1fr)}
.cardio-row .num{font-size:1.25rem}
.cardio-meta{display:block;color:var(--muted);font-size:.85rem}
.cardio-kcal{color:var(--yellow);font-weight:700}
.foot{color:var(--muted);font-size:.85rem;text-align:center;margin-top:8px}
.foot button{border:0;background:none;color:var(--blue);font-weight:600;padding:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="plates" aria-hidden="true">
        <i style="height:30px;background:var(--red)"></i><i style="height:26px;background:var(--blue)"></i><i style="height:22px;background:var(--yellow)"></i><i style="height:18px;background:var(--green)"></i>
      </div>
      <h1>Lift Log</h1>
    </div>
    <div class="unit-toggle" role="group" aria-label="Weight unit">
      <button data-unit="lb" aria-pressed="true">lb</button>
      <button data-unit="kg" aria-pressed="false">kg</button>
    </div>
  </header>

  <!-- LOG -->
  <section id="tab-log">
    <div class="panel">
      <div class="row pair">
        <div>
          <label class="lbl" for="group-filter">Muscle group</label>
          <select id="group-filter"></select>
        </div>
        <div>
          <label class="lbl" for="date">Date</label>
          <input id="date" type="date">
        </div>
      </div>
      <div style="margin-top:12px">
        <label class="lbl" for="exercise-pick">Exercise or machine</label>
        <input id="exercise-search" type="search" autocomplete="off" placeholder="Search exercises (optional)" aria-label="Search exercises" style="margin-bottom:8px">
        <select id="exercise-pick"></select>
      </div>
      <div id="new-ex-wrap" style="margin-top:12px">
        <div class="row two">
          <div>
            <label class="lbl" for="exercise">New exercise name</label>
            <input id="exercise" type="text" autocomplete="off" placeholder="e.g. Leg press">
          </div>
          <div id="new-muscle-wrap">
            <label class="lbl" for="muscle">Muscle group for this exercise</label>
            <select id="muscle"></select>
          </div>
        </div>
      </div>

      <div class="mode" role="group" aria-label="Set type">
        <button data-mode="straight" aria-pressed="true">Straight sets</button>
        <button data-mode="drop" aria-pressed="false">Drop / pyramid</button>
      </div>

      <div id="drop-wrap" hidden>
        <div class="drop-rows" id="drop-rows"></div>
        <div class="drop-tools">
          <button id="add-same">+ Same</button>
          <button id="add-up">+ Heavier</button>
          <button id="add-down">+ Drop</button>
          <label class="lbl" for="drop-pct" style="margin:0">by</label>
          <select id="drop-pct" aria-label="Weight change per step">
            <option value="10">10%</option><option value="20" selected>20%</option><option value="25">25%</option><option value="30">30%</option>
          </select>
        </div>
        <label class="check"><input type="checkbox" id="to-failure" checked> Last set taken to failure</label>
      </div>

      <div class="steppers" id="straight-wrap">
        <div class="stepper w">
          <label class="lbl" for="weight">Weight <span class="num-unit" id="w-unit">lb</span></label>
          <input id="weight" type="number" inputmode="decimal" min="0" step="any" value="0">
          <div class="btns"><button data-step="weight" data-dir="-1" aria-label="Decrease weight">−</button><button data-step="weight" data-dir="1" aria-label="Increase weight">+</button></div>
        </div>
        <div class="stepper">
          <label class="lbl" for="reps">Reps</label>
          <input id="reps" type="number" inputmode="numeric" min="1" step="1" value="10">
          <div class="btns"><button data-step="reps" data-dir="-1" aria-label="Decrease reps">−</button><button data-step="reps" data-dir="1" aria-label="Increase reps">+</button></div>
        </div>
        <div class="stepper">
          <label class="lbl" for="sets">Sets</label>
          <input id="sets" type="number" inputmode="numeric" min="1" step="1" value="1">
          <div class="btns"><button data-step="sets" data-dir="-1" aria-label="Decrease sets">−</button><button data-step="sets" data-dir="1" aria-label="Increase sets">+</button></div>
        </div>
      </div>

      <div id="cardio-wrap" hidden>
        <div class="steppers c2">
          <div class="stepper w">
            <label class="lbl" for="c-min">Duration <span class="num-unit">min</span></label>
            <input id="c-min" type="number" inputmode="decimal" min="0" step="any" value="30">
            <div class="btns"><button type="button" data-cstep="min" data-dir="-1" aria-label="Decrease duration">−</button><button type="button" data-cstep="min" data-dir="1" aria-label="Increase duration">+</button></div>
          </div>
          <div class="stepper">
            <label class="lbl" for="c-dist">Distance <span class="num-unit" id="c-dist-unit">mi</span></label>
            <input id="c-dist" type="number" inputmode="decimal" min="0" step="any" placeholder="—">
            <div class="btns"><button type="button" data-cstep="dist" data-dir="-1" aria-label="Decrease distance">−</button><button type="button" data-cstep="dist" data-dir="1" aria-label="Increase distance">+</button></div>
          </div>
        </div>
        <p class="lbl" style="margin:14px 0 0">Effort</p>
        <div class="seg" role="group" aria-label="Effort" id="effort-seg" style="margin-top:6px">
          <button type="button" data-effort="easy" aria-pressed="false">Easy</button>
          <button type="button" data-effort="moderate" aria-pressed="true">Moderate</button>
          <button type="button" data-effort="hard" aria-pressed="false">Hard</button>
        </div>
        <div id="cardio-details"></div>
      </div>

      <div class="equip">
        <label class="lbl" id="equip-lbl">Equipment</label>
        <div class="equip-toggles" id="equip-toggles" role="group" aria-labelledby="equip-lbl"></div>
        <div id="equip-fields"></div>
        <datalist id="brand-list"></datalist>
      </div>

      <button class="note-toggle" id="note-toggle" aria-expanded="false">Add a note</button>
      <div id="note-wrap" hidden style="margin-top:8px">
        <label class="lbl" for="note">Note</label>
        <input id="note" type="text" placeholder="Seat 4, felt easy">
      </div>

      <div class="actions">
        <button class="primary" id="save">Log set</button>
      </div>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </div>

    <div class="panel">
      <h2 id="day-title">Today</h2>
      <div id="day-list"></div>
    </div>
  </section>

  <!-- HISTORY -->
  <section id="tab-history" hidden>
    <div class="panel">
      <label class="lbl" for="hist-filter">Show exercise</label>
      <select id="hist-filter"></select>
    </div>
    <div id="history"></div>
  </section>

  <!-- PROGRESS -->
  <section id="tab-progress" hidden>
    <div class="panel">
      <label class="lbl" for="prog-ex">Exercise</label>
      <select id="prog-ex"></select>
      <div class="stats" id="prog-stats"></div>
      <div class="seg" role="group" aria-label="Chart metric" id="metric-seg"></div>
      <div class="chart-box"><canvas id="ex-chart" aria-label="Exercise progress chart" role="img"></canvas></div>
      <p class="empty" id="prog-empty" hidden>Log this exercise on at least one day to see a chart.</p>
    </div>
    <div class="panel">
      <h2>Training totals</h2>
      <div class="seg" role="group" aria-label="Chart measure" id="tot-seg">
        <button data-tot="vol" aria-pressed="true">Volume</button>
        <button data-tot="cal" aria-pressed="false">Calories</button>
        <button data-tot="min" aria-pressed="false">Cardio min</button>
      </div>
      <div class="seg" role="group" aria-label="Time range" id="range-seg">
        <button data-range="week" aria-pressed="true">Weekly</button>
        <button data-range="month" aria-pressed="false">Monthly</button>
        <button data-range="6m" aria-pressed="false">6 months</button>
        <button data-range="12m" aria-pressed="false">12 months</button>
      </div>
      <div class="chart-box"><canvas id="week-chart" aria-label="Training volume chart" role="img"></canvas></div>
      <p class="foot" id="range-total" style="margin-top:10px"></p>
    </div>
  </section>

  <p class="foot"><span id="store-label">Saved on this device</span><span id="export-wrap"> · <button id="export">Export CSV</button> · <button id="import">Import CSV</button></span></p>
  <input type="file" id="import-file" accept=".csv,text/csv" hidden>
</div>

<nav class="tabs" role="tablist">
  <button role="tab" aria-selected="true" data-tab="log">Log</button>
  <button role="tab" aria-selected="false" data-tab="history">History</button>
  <button role="tab" aria-selected="false" data-tab="progress">Progress</button>
</nav>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const LS_KEY = "liftlog.entries.v1", PREF_KEY = "liftlog.prefs.v1";
  const KG_PER_LB = 0.45359237;

  // ---------- prefs (per-device convenience) ----------
  let prefs = {unit:"lb"};
  try { prefs = Object.assign(prefs, JSON.parse(localStorage.getItem(PREF_KEY)||"{}")); } catch(e){}
  function savePrefs(){ try{ localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); }catch(e){} }

  // ---------- personal settings: body weight + per-day calorie adjustments ----------
  const SET_KEY = "liftlog.settings.v1";
  let settings = {bw:null, bwUnit:"lb", days:{}};
  try { settings = Object.assign(settings, JSON.parse(localStorage.getItem(SET_KEY)||"{}")); } catch(e){}
  if(!settings.days || typeof settings.days!=="object") settings.days = {};
  async function saveSettings(){
    try{ localStorage.setItem(SET_KEY, JSON.stringify(settings)); }catch(e){}
    if(typeof col!=="undefined" && col && typeof backend!=="undefined" && backend==="db"){
      try{ await col.doc("__settings").set(Object.assign({kind:"settings"}, settings)); }catch(e){}
    }
    renderAll();
  }

  // ---------- storage: synced db when available, local fallback ----------
  let entries = [];

  function loadLocal(){
    try { entries = JSON.parse(localStorage.getItem(LS_KEY)||"[]"); } catch(e){ entries = []; }
    if(!Array.isArray(entries)) entries = [];
  }
  function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(entries)); }catch(e){ flash("Couldn't save on this device.", true); } }

  const store = {
    async add(list){ entries.push(...list); saveLocal(); renderAll(); },
    async put(list){ const m=new Map(list.map(e=>[e.id,e])); entries = entries.map(e=>m.get(e.id)||e); saveLocal(); renderAll(); },
    async remove(id){ return this.removeMany([id]); },
    async removeMany(ids){ const set=new Set(ids); entries = entries.filter(e=>!set.has(e.id)); saveLocal(); renderAll(); }
  };

  loadLocal();

  // Ask the browser not to evict this app's storage
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}

  // ---------- CSV export / import ----------
  const CSV_COLS = ["id","date","exercise","weight","unit","reps","set_type","chain_id","step","to_failure","equipment","note","equipment_json","muscle_group","kind","minutes","distance","dist_unit","effort","avg_hr","machine_kcal","use_machine","cardio_json"];
  function toCSV(){
    const rows=[CSV_COLS];
    sorted().forEach(e=>rows.push([e.id,e.date,e.exercise,e.weight,e.unit,e.reps,e.kind==="cardio"?"cardio":e.chain?"drop":"straight",e.chain||"",e.chain?e.step+1:"",e.failure?"yes":"",equipText(e),e.note||"",e.equip?JSON.stringify(e.equip):"",e.muscle||"",e.kind||"strength",e.minutes||"",e.distance||"",e.distUnit||"",e.effort||"",e.hr||"",e.machineKcal||"",e.useMachine?"yes":"",e.extra?JSON.stringify(e.extra):""]));
    return rows.map(r=>r.map(v=>{const s=String(v); return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(",")).join("\n");
  }
  function parseCSV(text){
    const rows=[]; let row=[], f="", q=false;
    for(let i=0;i<text.length;i++){
      const c=text[i];
      if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
      else if(c==='"') q=true;
      else if(c===','){ row.push(f); f=""; }
      else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=""; }
      else f+=c;
    }
    if(f!==""||row.length){ row.push(f); rows.push(row); }
    return rows.filter(r=>r.some(x=>x.trim()!==""));
  }
  $("#export").onclick = async ()=>{
    const csv = toCSV(), name = `lift-log-${today()}.csv`;
    const file = new File([csv], name, {type:"text/csv"});
    try{
      if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"Lift Log backup"}); return; }
    }catch(e){ if(e && e.name==="AbortError") return; }
    const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=name;
    document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000);
  };
  $("#import").onclick = ()=> $("#import-file").click();
  $("#import-file").onchange = async ev=>{
    const file = ev.target.files[0]; ev.target.value=""; if(!file) return;
    let rows; try{ rows = parseCSV(await file.text()); }catch(e){ alert("Couldn't read that file."); return; }
    if(rows.length<2){ alert("That file has no workout rows."); return; }
    const head = rows[0].map(h=>h.trim().toLowerCase()), col = k=>head.indexOf(k);
    if(col("date")<0 || col("exercise")<0 || col("reps")<0 || col("weight")<0){ alert("That doesn't look like a Lift Log export."); return; }
    const have = new Set(entries.map(e=>e.id)), added=[]; let skipped=0;
    rows.slice(1).forEach((r,i)=>{
      const g = k=> col(k)>=0 ? (r[col(k)]||"").trim() : "";
      const date=g("date"), exercise=g("exercise"), weight=parseFloat(g("weight")), reps=parseInt(g("reps"),10);
      if(g("kind")==="cardio"){
        const minutes=parseFloat(g("minutes"));
        if(!/^\d{4}-\d{2}-\d{2}$/.test(date) || !exercise || !(minutes>0)){ skipped++; return; }
        const id = g("id") || uid(); if(have.has(id)) return; have.add(id);
        const c = {id, kind:"cardio", date, exercise, muscle:"Cardio", minutes, effort:g("effort")||"moderate", unit:g("unit")==="kg"?"kg":"lb", weight:0, reps:0, sets:1, note:g("note"), ts:Date.parse(date+"T12:00:00")+i};
        const d=parseFloat(g("distance")); if(d>0){ c.distance=d; c.distUnit=g("dist_unit")||"mi"; }
        const hr=parseFloat(g("avg_hr")); if(hr>0) c.hr=hr;
        const mk=parseFloat(g("machine_kcal")); if(mk>0){ c.machineKcal=mk; c.useMachine=g("use_machine")==="yes"; }
        try{ const x=g("cardio_json"); if(x) c.extra=JSON.parse(x); }catch(_){}
        added.push(c); return;
      }
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date) || !exercise || !(weight>=0) || !(reps>=1)){ skipped++; return; }
      const id = g("id") || uid();
      if(have.has(id)) return;
      have.add(id);
      const e = {id, date, exercise, weight, unit: g("unit")==="kg"?"kg":"lb", reps, sets:1, note:g("note"), ts: Date.parse(date+"T12:00:00")+i};
      const chain=g("chain_id"); if(chain){ e.chain=chain; e.step=Math.max(0,(parseInt(g("step"),10)||1)-1); }
      if(g("to_failure").toLowerCase()==="yes") e.failure=true;
      try{ const eq=g("equipment_json"); if(eq) e.equip=JSON.parse(eq); }catch(_){}
      const mg=g("muscle_group"); if(mg) e.muscle=mg;
      added.push(e);
    });
    if(!added.length){ alert(skipped?`Nothing imported — ${skipped} row(s) weren't valid.`:"Everything in that file is already in your log."); return; }
    await store.add(added);
    alert(`Imported ${added.length} entr${added.length===1?"y":"ies"}.` + (skipped?` Skipped ${skipped} invalid row(s).`:""));
  };

  // ---------- helpers ----------
  const today = ()=>{ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
  const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const toUnit = (w, from)=> from===prefs.unit ? w : (prefs.unit==="kg" ? w*KG_PER_LB : w/KG_PER_LB);
  const fmt = n => { const r = Math.round(n*10)/10; return (r%1===0? r.toFixed(0): r.toFixed(1)); };
  const fmtBig = n => n>=10000 ? (n/1000).toFixed(1)+"k" : Math.round(n).toLocaleString();
  const e1rm = (w,r)=> r<=1 ? w : w*(1+r/30); // Epley
  const niceDate = iso => new Date(iso+"T00:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",year: iso.slice(0,4)===today().slice(0,4)?undefined:"numeric"});
  const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const sorted = ()=> entries.slice().sort((a,b)=> a.date===b.date ? (a.ts||0)-(b.ts||0) : a.date<b.date?-1:1);
  const exercisesByRecent = ()=>{
    const seen = new Map();
    sorted().reverse().forEach(e=>{ const k=e.exercise.trim(); if(!seen.has(k.toLowerCase())) seen.set(k.toLowerCase(), k); });
    return [...seen.values()];
  };
  const lastFor = name => sorted().reverse().find(e=>e.kind!=="cardio" && e.exercise.toLowerCase()===name.toLowerCase());
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

  function flash(text, err){ const m=$("#msg"); m.textContent=text; m.className="msg"+(err?" err":""); clearTimeout(flash.t); flash.t=setTimeout(()=>m.textContent="",2600); }

  // ---------- unit toggle ----------
  function applyUnit(){
    document.querySelectorAll(".unit-toggle button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.unit===prefs.unit)));
    $("#w-unit").textContent = prefs.unit;
  }
  document.querySelectorAll(".unit-toggle button").forEach(b=>b.onclick=()=>{
    if(prefs.unit===b.dataset.unit) return;
    const w = parseFloat($("#weight").value)||0;
    const old = prefs.unit; prefs.unit=b.dataset.unit; savePrefs(); applyUnit();
    $("#weight").value = fmt(toUnit(w, old));
    Object.values(equipState).forEach(st=>{ const n=parseFloat(st.vals && st.vals.bar); if(n>=0) st.vals.bar=fmt(toUnit(n,old)); });
    renderEquipFields();
    if(isCardioForm()){ const v=readCardioVals(); renderCardioDetails(cardioTypeOf($("#exercise").value), v); }
    readDropRows(); dropRows = dropRows.map(r=>({weight:fmt(toUnit(parseFloat(r.weight)||0, old)), reps:r.reps})); if(mode==="drop") renderDropRows();
    renderAll();
  });

  // ---------- tabs ----------
  document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{
    document.querySelectorAll("nav.tabs button").forEach(x=>x.setAttribute("aria-selected", String(x===b)));
    ["log","history","progress"].forEach(t=> $("#tab-"+t).hidden = t!==b.dataset.tab);
    window.scrollTo(0,0);
    if(b.dataset.tab==="progress") renderProgress();
  });

  // ---------- log form ----------
  $("#date").value = today();
  document.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>{
    const f = b.dataset.step, dir = +b.dataset.dir, el = $("#"+f);
    const step = f==="weight" ? (prefs.unit==="kg"?2.5:5) : 1;
    const min = f==="weight"?0:1;
    el.value = fmt(Math.max(min, (parseFloat(el.value)||0) + dir*step));
  });
  $("#note-toggle").onclick = ()=>{
    const w=$("#note-wrap"); w.hidden=!w.hidden;
    $("#note-toggle").setAttribute("aria-expanded", String(!w.hidden));
    if(!w.hidden) $("#note").focus();
  };
  function prefill(name){
    const last = lastFor(name);
    if(!last){ applyEquip(suggestEquip(name), prefs.unit); return; }
    if(last){
      applyEquip(last.equip, last.unit);
      $("#weight").value = fmt(toUnit(last.weight, last.unit));
      $("#reps").value = last.reps;
      if(mode==="drop" && dropRows.length<=1){ dropRows=[{weight:fmt(toUnit(last.weight,last.unit)), reps:last.reps}]; renderDropRows(); }
    }
  }

  // ---------- drop / pyramid builder ----------
  let mode = "straight", dropRows = [];
  const stepSize = ()=> prefs.unit==="kg"?2.5:5;
  const roundStep = w => Math.max(0, Math.round(w/stepSize())*stepSize());
  function readDropRows(){
    document.querySelectorAll("#drop-rows .drop-row").forEach((r,i)=>{
      dropRows[i] = {weight:r.querySelector("[data-f=w]").value, reps:r.querySelector("[data-f=r]").value};
    });
  }
  function renderDropRows(){
    const peak = dropRows.reduce((m,r,i)=> (parseFloat(r.weight)||0) > (parseFloat(dropRows[m]?.weight)||0) ? i : m, 0);
    const cell = (f,i,val,attrs,label)=>`<div class="dcell"><button type="button" data-dstep="${f}" data-dir="-1" aria-label="Decrease set ${i+1} ${label}">−</button><input data-f="${f}" type="number" ${attrs} value="${esc(val)}" aria-label="Set ${i+1} ${label}"><button type="button" data-dstep="${f}" data-dir="1" aria-label="Increase set ${i+1} ${label}">+</button></div>`;
    $("#drop-rows").innerHTML = `<div class="drop-head"><span>#</span><span>Weight (${prefs.unit})</span><span>Reps</span><span></span></div>` +
      dropRows.map((r,i)=>`<div class="drop-row${i===peak&&dropRows.length>1?" peak":""}">
        <span class="idx">${i+1}</span>
        ${cell("w",i,r.weight,'inputmode="decimal" min="0" step="any"',"weight")}
        ${cell("r",i,r.reps,'inputmode="numeric" min="1" step="1"',"reps")}
        <button class="rm" data-rm="${i}" aria-label="Remove set ${i+1}" ${dropRows.length===1?"disabled":""}>×</button></div>`).join("");
  }
  $("#drop-rows").addEventListener("click", e=>{
    const b = e.target.closest("[data-dstep]"); if(!b) return;
    const isW = b.dataset.dstep==="w";
    const input = b.parentElement.querySelector("input");
    const step = isW ? stepSize() : 1, min = isW ? 0 : 1;
    input.value = fmt(Math.max(min, (parseFloat(input.value)||0) + (+b.dataset.dir)*step));
    input.dispatchEvent(new Event("change", {bubbles:true}));
  });

  $("#drop-rows").addEventListener("input", readDropRows);
  // Update the heaviest-row highlight without rebuilding the inputs (rebuilding would steal focus mid-entry)
  $("#drop-rows").addEventListener("change", ()=>{
    readDropRows();
    const rows=[...document.querySelectorAll("#drop-rows .drop-row")];
    const peak = dropRows.reduce((m,r,i)=> (parseFloat(r.weight)||0) > (parseFloat(dropRows[m]?.weight)||0) ? i : m, 0);
    rows.forEach((r,i)=>r.classList.toggle("peak", i===peak && rows.length>1));
  });
  $("#drop-rows").addEventListener("click", e=>{
    const b=e.target.closest("[data-rm]"); if(!b) return;
    readDropRows(); dropRows.splice(+b.dataset.rm,1); renderDropRows();
  });
  function addDropRow(dir){
    readDropRows();
    const last = dropRows[dropRows.length-1] || {weight:$("#weight").value, reps:$("#reps").value};
    const w = parseFloat(last.weight)||0, pct = +$("#drop-pct").value/100;
    let nw = w;
    if(dir!==0){ nw = roundStep(dir>0 ? w*(1+pct) : w*(1-pct)); if(nw===w) nw = Math.max(0, w + dir*stepSize()); }
    dropRows.push({weight:fmt(nw), reps:last.reps});
    renderDropRows();
    const inputs=document.querySelectorAll("#drop-rows [data-f=r]"); inputs[inputs.length-1]?.focus();
  }
  $("#add-same").onclick = ()=>addDropRow(0);
  $("#add-up").onclick = ()=>addDropRow(1);
  $("#add-down").onclick = ()=>addDropRow(-1);
  document.querySelectorAll(".mode button").forEach(b=>b.onclick=()=>{
    mode=b.dataset.mode;
    document.querySelectorAll(".mode button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
    $("#drop-wrap").hidden = mode!=="drop";
    $("#straight-wrap").hidden = mode==="drop";
    $("#save").textContent = mode==="drop" ? "Log drop set" : "Log set";
    applyFormKind();
    if(mode==="drop" && !dropRows.length){ dropRows=[{weight:$("#weight").value, reps:$("#reps").value}]; }
    if(mode==="drop") renderDropRows();
  });
  $("#exercise").addEventListener("change", e=>{ if(lastFor(e.target.value)) prefill(e.target.value); });

  $("#save").onclick = async ()=>{
    const exercise = $("#exercise").value.trim().replace(/\s+/g," ");
    if(isCardioForm()) return saveCardio(exercise);
    if(mode==="drop") return saveDrop(exercise);
    const weight = parseFloat($("#weight").value);
    const reps = parseInt($("#reps").value,10);
    const sets = parseInt($("#sets").value,10);
    const date = $("#date").value || today();
    if(!exercise){ flash($("#new-ex-wrap").hidden ? "Choose an exercise, or pick ＋ New exercise." : "Enter a name for the new exercise.", true); ($("#new-ex-wrap").hidden ? $("#exercise-pick") : $("#exercise")).focus(); return; }
    if(!(weight>=0)){ flash("Enter a weight of 0 or more.", true); return; }
    if(!(reps>=1)){ flash("Reps must be at least 1.", true); return; }
    if(!(sets>=1 && sets<=50)){ flash("Sets must be between 1 and 50.", true); return; }
    // match existing capitalization
    const existing = exercisesByRecent().find(n=>n.toLowerCase()===exercise.toLowerCase());
    const name = existing || exercise;
    const note = $("#note").value.trim();
    const base = Date.now();
    const list = Array.from({length:sets},(_,i)=>({id:uid(), date, exercise:name, weight, unit:prefs.unit, reps, sets:1, note, muscle: $("#muscle").value, ...equipField(), ts:base+i}));
    const btn=$("#save"); btn.disabled=true;
    try{
      await store.add(list);
      flash(`Logged ${sets} × ${reps} @ ${fmt(weight)} ${prefs.unit} — ${name}`);
      $("#note").value=""; $("#sets").value=1;
    }catch(e){ flash("Couldn't save that set. Try again.", true); }
    btn.disabled=false;
  };

  // ---------- equipment toggles ----------
  // For an exercise you haven't logged yet, switch on the likely equipment from its name.
  function suggestEquip(name){
    const n = (name||"").toLowerCase(), eq = {};
    if(/smith/.test(n)) eq.smith = {};
    else if(/plate-loaded|t-bar|hammer row|hammer-style|leverage|pendulum|hack squat|v-squat|belt squat|glute drive|leg press/.test(n)) eq.plate = {};
    else if(/cable|pushdown|face pull|straight-arm|lat pulldown|pulldown|pull-through|pallof|woodchop|cable chop/.test(n)){
      const a = /rope/.test(n) ? "Rope pulldown" : /v-bar/.test(n) ? "V bar" : /straight.?bar|bar straight/.test(n) ? "Straight bar" : /ez/.test(n) ? "EZ bar" : null;
      eq.cable = a ? {attach:a} : {};
    }
    else if(/dumbbell|goblet|arnold|zottman|concentration|spider curl|hammer curl|farmer|suitcase/.test(n)) eq.db = {};
    else if(/machine|pec deck|selectorized|iso-lateral|converging|chest press|seated row|reverse pec|leg curl|lying curl|seated curl|leg extension|single-leg extension|calf raise|abduction|ab crunch|preacher curl/.test(n)) eq.pin = {};
    else if(/barbell|ez-bar|bench press|deadlift|\brdl\b|squat|pendlay|yates|seal row|snatch|good morning|overhead press|skull crusher|drag curl|shrug|hip thrust|glute bridge/.test(n))
      eq.barbell = /ez-bar/.test(n) ? {type:"EZ bar"} : /trap bar/.test(n) ? {type:"Trap bar"} : {type:"Straight bar"};
    const key = Object.keys(eq)[0];
    if(key && key!=="barbell"){
      if(/single-arm|single-leg|one-arm|one-leg|unilateral|single arm|single leg/.test(n)) eq[key].side = "One side (unilateral)";
      else eq[key].side = "Both sides";
    }
    return eq;
  }
  const EQUIP = [
    {key:"smith",   label:"Smith machine",    fields:[{k:"bar",label:"Bar weight",num:true},{k:"brand",label:"Brand",brand:true},{k:"side",label:"Arms / legs",options:["Both sides","One side (unilateral)"]}]},
    {key:"barbell", label:"Barbell",          fields:[{k:"type",label:"Bar type",options:["Straight bar","EZ bar","Trap bar"]},{k:"bar",label:"Bar weight",num:true}]},
    {key:"cable",   label:"Cable machine",    fields:[{k:"brand",label:"Brand",brand:true},{k:"attach",label:"Attachment",options:["D grip","Rope pulldown","V bar","Straight bar","EZ bar"]},{k:"side",label:"Arms / legs",options:["Both sides","One side (unilateral)"]}]},
    {key:"pin",     label:"Pin-select machine",fields:[{k:"brand",label:"Brand",brand:true},{k:"seat",label:"Seat / setting",ph:"Seat 4, pad 2"},{k:"side",label:"Arms / legs",options:["Both sides","One side (unilateral)"]}]},
    {key:"plate",   label:"Plate-loaded machine",fields:[{k:"brand",label:"Brand",brand:true},{k:"seat",label:"Seat / setting",ph:"Seat 3"},{k:"side",label:"Arms / legs",options:["Both sides","One side (unilateral)"]}]},
    {key:"db",      label:"Dumbbells",        fields:[{k:"side",label:"Arms / legs",options:["Both sides","One side (unilateral)"]},{k:"each",label:"Weight is per hand",check:true}]},
    {key:"band",    label:"Band / assist",    fields:[{k:"level",label:"Band color or level",ph:"Red, heavy"},{k:"side",label:"Arms / legs",options:["Both sides","One side (unilateral)"]}]},
  ];
  let equipState = {};
  function renderEquipToggles(){
    $("#equip-toggles").innerHTML = EQUIP.map(q=>`<label class="tog"><input type="checkbox" role="switch" data-eq="${q.key}" ${equipState[q.key]?.on?"checked":""}><span class="sw" aria-hidden="true"></span>${q.label}</label>`).join("");
  }
  function renderEquipFields(){
    $("#equip-fields").innerHTML = EQUIP.filter(q=>equipState[q.key]?.on).map(q=>{

  function cardioKcal(e){
    const T = cardioTypeOf(e.exercise), mins = e.minutes, x = e.extra||{};
    if(!(mins>0)) return null;
    let watts = x.watts>0 ? x.watts : null;
    if(!watts && (T==="rower"||T==="skierg")){
      const split = x.splitSec>0 ? x.splitSec : (e.distance>0 ? mins*60/(toMeters(e.distance,e.distUnit)/500) : null);
      if(split>0) watts = 2.80/Math.pow(split/500,3);   // Concept2 pace-to-watts formula

    if(watts) return {kcal: watts*mins*60/1000, method:"from watts"};   // ~1 kcal burned per kJ of work
    if(!(settings.bw>0)) return null;
    const kg = settings.bwUnit==="kg" ? settings.bw : settings.bw*KG_PER_LB;

  async function saveCardio(exercise){

  const canonName = name => { const n=name.trim().replace(/\s+/g," "); return exercisesByRecent().find(x=>x.toLowerCase()===n.toLowerCase()) || n; };
  async function saveEdit(box){
    const kind = box.dataset.editKind, id = box.dataset.id;
    const val = k => { const i = box.querySelector(`[data-ef="${k}"]`); return i ? (i.type==="checkbox" ? i.checked : i.value.trim()) : ""; };
    const bad = msg => { alert(msg); return null; };
    const exercise = canonName(val("exercise")), date = val("date");
    if(!exercise) return bad("Enter an exercise name.");
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return bad("Choose a date.");
    const renamed = list => list[0].exercise.toLowerCase()!==exercise.toLowerCase();
    const newMuscle = old => isCardio(old) ? "Cardio" : (renamed([old]) ? groupOf(exercise) : old.muscle);
    let updates = [], removed = [];
    if(kind==="set"){
      const old = entries.find(e=>e.id===id); if(!old) return;
      const weight = parseFloat(val("weight")), reps = parseInt(val("reps"),10);
      if(!(weight>=0)) return bad("Weight must be 0 or more.");
      if(!(reps>=1)) return bad("Reps must be at least 1.");
      updates = [Object.assign({}, old, {exercise, date, weight, unit:prefs.unit, reps, note:val("note"), muscle:newMuscle(old)})];
    } else if(kind==="chain"){
      const olds = entries.filter(e=>e.chain===id).sort((a,b)=>a.step-b.step); if(!olds.length) return;
      const rows = [...box.querySelectorAll("[data-step-id]")];
      if(!rows.length) return bad("A drop set needs at least one step. Use Delete to remove it entirely.");
      const keep = new Set(rows.map(r=>r.dataset.stepId));
      removed = olds.filter(e=>!keep.has(e.id)).map(e=>e.id);
      const fail = val("failure");
      for(let i=0;i<rows.length;i++){
        const r = rows[i], old = olds.find(e=>e.id===r.dataset.stepId);
        const weight = parseFloat(r.querySelector('[data-sf="weight"]').value), reps = parseInt(r.querySelector('[data-sf="reps"]').value,10);
        if(!(weight>=0) || !(reps>=1)) return bad(`Check step ${i+1}: weight 0 or more, reps at least 1.`);
        updates.push(Object.assign({}, old, {exercise, date, weight, unit:prefs.unit, reps, step:i, note:val("note"), failure: !!fail && i===rows.length-1, muscle:newMuscle(old)}));
      }
    } else {
      const old = entries.find(e=>e.id===id); if(!old) return;
      const minutes = parseFloat(val("minutes"));
      if(!(minutes>0)) return bad("Duration must be more than 0 minutes.");
      const e = Object.assign({}, old, {exercise, date, minutes, effort:val("effort")||"moderate", note:val("note")});
      const T = cardioTypeOf(exercise);
      const d = parseFloat(val("distance"));
      if(d>0){ e.distance=d; e.distUnit = old.distUnit || distUnitFor(T); } else { delete e.distance; delete e.distUnit; }
      const hr = parseFloat(val("hr")); if(hr>0) e.hr=hr; else delete e.hr;
      const mk = parseFloat(val("mk")); if(mk>0){ e.machineKcal=mk; e.useMachine=!!val("use"); } else { delete e.machineKcal; delete e.useMachine; }
      const x = {};
      box.querySelectorAll("[data-ex]").forEach(i=>{
        const k=i.dataset.ex;
        if(k==="split"){ const sp=parseSplit(i.value); if(sp) x.splitSec=sp; return; }
        const n=parseFloat(i.value); if(n>0) x[k]=n;
      });
      if(x.speed) x.speedUnit = (old.extra&&old.extra.speedUnit) || (prefs.unit==="kg"?"kmh":"mph");
      if(Object.keys(x).length) e.extra=x; else delete e.extra;
      updates=[e];
    }
    try{
      if(removed.length) await store.removeMany(removed);
      editing = null;
      await store.put(updates);
      renderAll();
    }catch(err){ alert("Couldn't save those changes. Try again."); }
  }

  function setRow(e){
    if(editing===e.id) return editSetHTML(e);

  }
  function chainRow(c){
    if(editing===c[0].chain) return editChainHTML(c);
    const ws = c.map(e=>toUnit(e.weight,e.unit)), peak = Math.max(...ws);
    const up = ws.some((w,i)=>i>0 && w>ws[i-1]);
    const steps = c.map((e,i)=>`${i?'<span class="arrow">→</span>':""}<span class="${ws[i]===peak?"peak":""}">${fmt(ws[i])}×${e.reps}</span>${e.failure?'<span class="fail">F</span>':""}`).join("");

    const note = (c[0].note||eqt) ? `<div class="set"><span class="note">${eqt?`<span class="eq-line">${esc(eqt)}</span>`:""}${esc(c[0].note||"")}</span></div>` : "";
    return `<div class="chain"><div class="chain-top"><span class="tag">${up?"Pyramid":"Drop set"} · ${c.length}</span><button class="edit" data-edit="${esc(c[0].chain)}" aria-label="Edit this drop set">Edit</button><button class="del" data-del-chain="${esc(c[0].chain)}" aria-label="Delete this drop set">Delete</button></div><div class="chain-steps">${steps}</div>${note}</div>`;
  }
  // ---------- calorie estimate (MET method) ----------
  // Approximate published activity ratings for weight training.
  const MET = {light:3.0, moderate:3.5, vigorous:6.0};
  const cap = w => w.charAt(0).toUpperCase()+w.slice(1);
  let calOpen = false;
  function dayCalc(date, list){
    list = (list || entries.filter(e=>e.date===date)).filter(e=>!isCardio(e));
    if(!list.length || !(settings.bw>0)) return null;
    const kg = settings.bwUnit==="kg" ? settings.bw : settings.bw*KG_PER_LB;
    const o = settings.days[date] || {};
    const ts = list.map(e=>e.ts).filter(t=>typeof t==="number" && t>1e12);
    const sameDay = ts.length>0 && ts.every(t=>isoOf(new Date(t))===date);
    const span = ts.length ? (Math.max(...ts)-Math.min(...ts))/60000 : 0;
    let mins, src;
    if(o.min>0){ mins=o.min; src="set by you"; }
    else if(sameDay && span>=10 && span<=240){ mins=Math.round(span+5); src="from your set times"; }
    else { mins=Math.max(10, Math.round(list.length*2.5)); src=`estimated from ${list.length} sets`; }
    const density = list.length/mins;
    const autoLvl = density>=0.45 ? "vigorous" : density>=0.25 ? "moderate" : "light";
    const lvl = (o.int && MET[o.int]) ? o.int : autoLvl;
    return {kcal: MET[lvl]*kg*mins/60, net: (MET[lvl]-1)*kg*mins/60, mins, src, lvl, autoLvl, isAuto: !(o.int && MET[o.int]), o};
  }
  function dayTotalCalories(date){
    const list = entries.filter(e=>e.date===date);

  function weekStart(iso){ const d=new Date(iso+"T00:00:00"); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return d; }
  function isoOf(d){ const x=new Date(d); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,10); }

  // Volume by range: Weekly = last 7 days by day; Monthly = last 5 weeks by week;
  // 6 / 12 months = calendar months.
  function renderWeekly(){
    const keys=[], labels=[], titles=[]; let keyOf;
    const now = new Date(today()+"T00:00:00");
    if(range==="week"){
      for(let i=6;i>=0;i--){ const d=new Date(now); d.setDate(d.getDate()-i); keys.push(isoOf(d));
        labels.push(d.toLocaleDateString(undefined,{weekday:"short"})); titles.push(d.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})); }
      keyOf = e=>e.date;
    } else if(range==="month"){
      const start = weekStart(today()); start.setDate(start.getDate()-7*4);
      for(let i=0;i<5;i++){ const d=new Date(start); d.setDate(d.getDate()+7*i); keys.push(isoOf(d));
        const l=d.toLocaleDateString(undefined,{month:"short",day:"numeric"}); labels.push(l); titles.push("Week of "+l); }
      keyOf = e=>isoOf(weekStart(e.date));
    } else {
      const n = range==="6m" ? 6 : 12;
      for(let i=n-1;i>=0;i--){ const d=new Date(now.getFullYear(), now.getMonth()-i, 1); keys.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"));
        labels.push(d.toLocaleDateString(undefined,{month:"short"})); titles.push(d.toLocaleDateString(undefined,{month:"long",year:"numeric"})); }
      keyOf = e=>e.date.slice(0,7);
    }
    const totals = keys.map(()=>0), cals = keys.map(()=>0), mins = keys.map(()=>0), days = new Set();
    entries.forEach(e=>{ const i = keys.indexOf(keyOf(e)); if(i<0) return; days.add(e.date);
      if(isCardio(e)) mins[i] += e.minutes||0; else totals[i] += toUnit(e.weight,e.unit)*e.reps; });
    days.forEach(d=>{ const i = keys.indexOf(keyOf({date:d})); const k = dayTotalCalories(d); if(i>=0 && k!=null) cals[i] += k; });
    const sum = totals.reduce((a,b)=>a+b,0), calSum = cals.reduce((a,b)=>a+b,0), minSum = mins.reduce((a,b)=>a+b,0);
    const parts = [];
    if(sum) parts.push(`${Math.round(sum).toLocaleString()} ${prefs.unit} lifted`);
    if(minSum) parts.push(`${Math.round(minSum).toLocaleString()} cardio min`);
    if(calSum) parts.push(`≈ ${Math.round(calSum).toLocaleString()} calories`);
    $("#range-total").textContent = !days.size ? "Nothing logged in this range yet." :
      parts.join(" · ") + ` across ${days.size} workout day${days.size===1?"":"s"}` +
      (tot==="cal" && !(settings.bw>0) ? ". Add your body weight under Day total on the Log tab to see calories." : "");
    const showCal = tot==="cal", showMin = tot==="min";
    if(wkChart) wkChart.destroy();
    wkChart = new Chart($("#week-chart"),{
      type:"bar",
      data:{labels, datasets:[{label: showCal?"Calories":showMin?"Cardio minutes":"Volume", data:(showCal?cals:showMin?mins:totals).map(v=>Math.round(v)), backgroundColor:css(showCal?"--yellow":showMin?"--green":"--blue"), borderRadius:5}]},
      options:{responsive:true, maintainAspectRatio:false, animation:matchMedia("(prefers-reduced-motion: reduce)").matches?false:{duration:400},
        plugins:{legend:{display:false}, tooltip:{callbacks:{title:c=>titles[c[0].dataIndex], label:c=> showCal ? `≈ ${c.parsed.y.toLocaleString()} calories` : showMin ? `${c.parsed.y.toLocaleString()} cardio minutes` : `${c.parsed.y.toLocaleString()} ${prefs.unit} lifted`}}},
        scales:{y:{beginAtZero:true, grid:{color:css("--line")}}, x:{grid:{display:false}}}}
    });
  }


  $("#prog-ex").addEventListener("change", renderProgress);
  $("#metric-seg").addEventListener("click", e=>{
    const b=e.target.closest("[data-metric]"); if(!b) return;
    metric=b.dataset.metric; renderProgress();
  });
  document.querySelectorAll("#tot-seg button").forEach(b=>b.onclick=()=>{
    tot=b.dataset.tot;
    document.querySelectorAll("#tot-seg button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
    renderWeekly();
  });
  document.querySelectorAll("#range-seg button").forEach(b=>b.onclick=()=>{
    range=b.dataset.range;
    document.querySelectorAll("#range-seg button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
    renderWeekly();
  });
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", ()=>{ if(!$("#tab-progress").hidden) renderProgress(); });

  function renderAll(){
    renderChips(); renderBrandList(); renderDay(); renderHistory();
    if(!$("#tab-progress").hidden) renderProgress();
  }

  window.addEventListener("storage", ev=>{ if(ev.key===LS_KEY){ loadLocal(); renderAll(); } });

  // Offline support
  if("serviceWorker" in navigator && location.protocol!=="file:"){
    window.addEventListener("load", ()=> navigator.serviceWorker.register("sw.js").catch(()=>{}));
  }

  applyUnit();
  renderAll();
  applyFormKind();
})();
</script>
</body>
</html>
