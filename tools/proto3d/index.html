<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D figure prototype</title>
<link rel="stylesheet" href="../../css/app.css">
<script type="importmap">{"imports":{"three":"../../vendor/three/three.module.js","three/addons/":"../../vendor/three/addons/"}}</script>
<style>
  .p-big{display:block;width:100%;height:300px;border-radius:12px;background:var(--field);cursor:grab}
  .p-big:active{cursor:grabbing}
  .p-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
  .p-row:first-child{border-top:0}
  .p-th{flex:none;width:40px;height:36px;border-radius:8px;background:var(--surface)}
  .p-thumb{flex:none;width:54px;height:54px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
  .p-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .p-tile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:.75rem;font-weight:600}
  .p-tile canvas{width:100%;height:64px}
  .p-pick{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .p-pick button{min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--field);font-weight:600}
  .p-pick button[aria-pressed="true"]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
  .p-stat{font-size:.85rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="titles"><p class="kicker">Prototype</p><h1>3D figures</h1></div>
    <div class="seg" role="group" aria-label="Theme" style="width:auto"><button type="button" data-th="light">Light</button><button type="button" data-th="dark">Dark</button></div></header>

  <div class="panel">
    <h3 style="margin-top:0" id="big-name"></h3>
    <canvas class="p-big" id="big" aria-label="Exercise animation. Drag to turn."></canvas>
    <p class="cal-sub">Drag to turn it; it eases back. Tempo: 2 s down, pause, 1 s up. The blue arrow shows which way to push or pull while lifting.</p>
    <div class="p-pick" id="pick"></div>
  </div>

  <div class="panel">
    <h3 style="margin-top:0">Log card thumbnail</h3>
    <div class="ex-chosen"><span class="ex-chosen-text"><canvas class="p-thumb" data-ex="pulldown"></canvas><span class="ex-chosen-words"><span class="ex-n">Lat pulldown — wide overhand</span><span class="ex-m">Back · Lats: lat pulldown</span></span></span><button type="button" class="secondary">Change</button></div>
  </div>

  <div class="panel">
    <h3 style="margin-top:0">Picker rows</h3>
    <div class="ex-results" style="max-height:none;padding:0 12px" id="rows"></div>
  </div>

  <div class="panel">
    <h3 style="margin-top:0">Browse by movement</h3>
    <div class="p-tiles" id="tiles"></div>
    <p class="p-stat" id="stat"></p>
  </div>
</div>
<script type="module">
  import { load, show, EXERCISES } from "./figure3d.js";
  const $ = s => document.querySelector(s);
  document.querySelectorAll("[data-th]").forEach(b => b.onclick = () => document.documentElement.setAttribute("data-theme", b.dataset.th));
  const keys = Object.keys(EXERCISES);
  const t0 = performance.now();
  await load("../../models/body.glb");
  const big = show($("#big"), "squat", {rotate: true});
  const pick = k => { big.key = k; big.yaw = 0; $("#big-name").textContent = EXERCISES[k].name; document.querySelectorAll("#pick button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.k === k))); };
  $("#pick").innerHTML = keys.map(k => `<button type="button" data-k="${k}">${EXERCISES[k].name.split(" — ")[0]}</button>`).join("");
  $("#pick").onclick = e => { const b = e.target.closest("[data-k]"); if(b) pick(b.dataset.k); };
  pick("squat");
  document.querySelectorAll(".p-thumb").forEach(c => show(c, c.dataset.ex, {arrows: false}));
  $("#rows").innerHTML = keys.map(k => `<div class="p-row"><canvas class="p-th" data-k="${k}"></canvas><span class="ex-txt"><span class="ex-n">${EXERCISES[k].name}</span><span class="ex-m">Live 3D thumbnail</span></span></div>`).join("");
  document.querySelectorAll("#rows canvas").forEach((c, i) => show(c, c.dataset.k, {arrows: false, offset: i * .7}));
  $("#tiles").innerHTML = keys.map(k => `<div class="p-tile"><canvas data-k="${k}"></canvas>${["Squat","Press","Pulldown","Raise"][keys.indexOf(k)]}</div>`).join("");
  document.querySelectorAll("#tiles canvas").forEach((c, i) => show(c, c.dataset.k, {arrows: false, offset: i * 1.1}));
  // Frame rate with every view live.
  let n = 0, s0 = performance.now();
  const tick = () => { n++; const dt = performance.now() - s0; if(dt > 2000){ $("#stat").textContent = `${(n * 1000 / dt).toFixed(0)} frames a second with 13 live views.`; n = 0; s0 = performance.now(); } requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
  window.__ready = true;
</script>
</body>
</html>
