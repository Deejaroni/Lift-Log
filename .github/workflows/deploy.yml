name: Test and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    # Pinned: ubuntu-latest is moving to Ubuntu 26; switch once Playwright supports it (see docs/DECISIONS.md).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Stamp version
        run: |
          V="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/$V/g" sw.js js/version.js
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js vendor fonts icons _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    # Pinned: ubuntu-latest is moving to Ubuntu 26; switch once Playwright supports it (see docs/DECISIONS.md).
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
